<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --card:rgba(255,255,255,.08);
      --card-border:rgba(255,255,255,.16);
      --text:#e5e7eb;
      --muted:rgba(229,231,235,.75);
      --primary:#3b82f6;
      --primary2:#2563eb;
      --danger:#ef4444;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background: radial-gradient(1200px 600px at 20% 10%, rgba(59,130,246,.35), transparent 60%),
                  radial-gradient(900px 500px at 90% 20%, rgba(37,99,235,.25), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
    }
    .card{
      width:min(420px, 100%);
      background:var(--card);
      border:1px solid var(--card-border);
      border-radius:var(--radius);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding:22px;
    }
    .top{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom:18px;
    }
    .logo{
      width:44px; height:44px;
      border-radius:12px;
      background: linear-gradient(135deg, rgba(59,130,246,.95), rgba(37,99,235,.75));
      display:flex; align-items:center; justify-content:center;
      font-weight:800;
      letter-spacing:.5px;
      user-select:none;
    }
    h1{font-size:20px; margin:0 0 6px 0;}
    p{margin:0; color:var(--muted); line-height:1.4; font-size:13px;}

    form{display:flex; flex-direction:column; gap:12px;}
    label{font-size:13px; color:var(--muted);}
    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    input{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      color:var(--text);
      outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus{
      border-color: rgba(59,130,246,.7);
      box-shadow: 0 0 0 4px rgba(59,130,246,.15);
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:2px;
    }
    .check{
      display:flex; align-items:center; gap:8px;
      color:var(--muted);
      font-size:13px;
      user-select:none;
    }
    .check input{width:auto; padding:0;}

    .btn{
      margin-top:6px;
      border:0;
      padding:12px 14px;
      border-radius:12px;
      font-weight:700;
      color:white;
      cursor:pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 10px 30px rgba(37,99,235,.35);
      transition: transform .05s ease, filter .15s ease;
    }
    .btn:active{transform: translateY(1px)}

    .links{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:14px;
      font-size:13px;
    }
    .links a{color:#93c5fd; text-decoration:none}
    .links a:hover{text-decoration:underline}

    .msg{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      border:1px solid rgba(239,68,68,.35);
      background: rgba(239,68,68,.12);
      color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Login form">
    <div class="top">
      <div class="logo">L</div>
      <div>
        <h1>Welcome back</h1>
        <p>Sign in to continue. This is a front-end only demo page.</p>
      </div>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" />
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <a href="#" style="color:#93c5fd;text-decoration:none" aria-label="Forgot password">Forgot password?</a>
      </div>

      <button class="btn" type="submit">Login</button>
      <div class="msg" id="msg" aria-live="polite"></div>

      <div class="links">
        <a href="#" aria-label="Create account">Create account</a>
        <a href="#" aria-label="Contact support">Support</a>
      </div>
    </form>
  </div>

  <script>
    // Demo-only validation feedback
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        msg.textContent = 'Please enter your email and password.';
        msg.style.display = 'block';
        return;
      }

      // Fake check to make the page feel alive
      if (email.toLowerCase() === 'demo@example.com' && password === 'password123') {
        msg.style.display = 'block';
        msg.style.borderColor = 'rgba(34,197,94,.35)';
        msg.style.background = 'rgba(34,197,94,.12)';
        msg.style.color = '#bbf7d0';
        msg.textContent = 'Login successful (demo).';
      } else {
        msg.style.display = 'block';
        msg.style.borderColor = 'rgba(239,68,68,.35)';
        msg.style.background = 'rgba(239,68,68,.12)';
        msg.style.color = '#fecaca';
        msg.textContent = 'Invalid credentials. Try demo@example.com / password123.';
      }
    });
  </script>
</body>
</html>
